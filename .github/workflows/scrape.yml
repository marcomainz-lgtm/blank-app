name: Tägliche Badminton-Prüfung

on:
  schedule:
    - cron: '0 6 * * *'  # Täglich um 06:00 Uhr UTC (ca. 07:00 / 08:00 Uhr deutsche Zeit)
  workflow_dispatch:      # Ermöglicht das manuelle Auslösen über GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Scraper ausführen und Gist aktualisieren
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_ID: ${{ secrets.GIST_ID }}
      run: |
        python tracker.py